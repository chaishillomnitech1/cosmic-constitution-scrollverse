name: Repo Sync

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      sync_direction:
        description: 'Sync direction (hub-to-repo or repo-to-hub)'
        required: true
        default: 'hub-to-repo'
        type: choice
        options:
          - hub-to-repo
          - repo-to-hub

permissions:
  contents: write
  pull-requests: write
name: Repository Sync

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      sync_direction:
        description: 'Sync direction (upstream or mirror)'
        required: true
        default: 'upstream'
        type: choice
        options:
          - upstream
          - mirror

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_PAT }}

      - name: Setup Git and GitHub CLI
        run: |
          git config --global user.name "ScrollVerse Sync Bot"
          git config --global user.email "sync-bot@scrollverse.omnithrone"

      - name: Check sync configuration
        id: check-config
        run: |
          # Check if this repo should participate in repo-sync
          # This is determined by presence of .sync-config.json
          if [ -f ".sync-config.json" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
            echo "✅ Repo sync enabled"
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "⚠️ Repo sync not configured - create .sync-config.json to enable"
            echo "Example configuration:"
            cat << 'EOF'
          {
            "hub_repo": "chaishillomnitech1/scrollverse-hub",
            "sync_paths": [
              ".github/workflows/",
              "SECURITY.md",
              "CODEOWNERS"
            ],
            "sync_direction": "hub-to-repo",
            "auto_merge": false
          }
          EOF
          fi

      - name: Fetch hub repository
        if: steps.check-config.outputs.enabled == 'true'
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
        run: |
          # Check if PAT is configured
          if [ -z "$GITHUB_PAT" ]; then
            echo "⚠️ GITHUB_PAT not configured - cannot sync with hub"
            echo "Add GITHUB_PAT secret to enable repo sync"
            exit 1
          fi
          
          # Read sync configuration
          hub_repo=$(jq -r '.hub_repo // "chaishillomnitech1/scrollverse-hub"' .sync-config.json)
          echo "Hub repository: $hub_repo"
          
          # Add hub as remote
          git remote add hub "https://$GITHUB_PAT@github.com/$hub_repo.git" 2>/dev/null || true
          git fetch hub main 2>/dev/null || git fetch hub master 2>/dev/null || true

      - name: Sync from hub to repo
        if: |
          steps.check-config.outputs.enabled == 'true' &&
          (github.event_name == 'schedule' || 
           github.event.inputs.sync_direction == 'hub-to-repo')
        run: |
          # Read sync paths
          sync_paths=$(jq -r '.sync_paths[]' .sync-config.json)
          
          # Create sync branch
          timestamp=$(date +%Y%m%d-%H%M%S)
          sync_branch="sync/hub-updates-$timestamp"
          git checkout -b $sync_branch
          
          # Sync each configured path
          changes_made=false
          for path in $sync_paths; do
            if git ls-tree -r hub/main --name-only | grep -q "^$path"; then
              echo "Syncing: $path"
              git checkout hub/main -- $path 2>/dev/null || echo "Path not found in hub: $path"
              changes_made=true
            fi
          done
          
          # Commit and push if changes were made
          if [ "$changes_made" = true ]; then
            git add .
            if git diff --staged --quiet; then
              echo "No changes to sync"
            else
              git commit -m "chore(sync): sync updates from hub

              Synced paths from scrollverse-hub repository
              - Automated sync via repo-sync workflow"
              
              git push origin $sync_branch
              
              # Create PR for review
              gh pr create \
                --title "chore(sync): Hub repository updates" \
                --body "Automated sync from hub repository. Please review changes before merging." \
                --base main \
                --head $sync_branch
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_PAT }}

      - name: Sync from repo to hub
        if: |
          steps.check-config.outputs.enabled == 'true' &&
          github.event.inputs.sync_direction == 'repo-to-hub'
        run: |
          echo "⚠️ Repo-to-hub sync requires manual approval"
          echo "This operation should be carefully controlled"
          echo "Use workflow_dispatch with explicit confirmation"

      - name: Summary
        if: always()
        run: |
          echo "=== Repo Sync Summary ==="
          echo "Repository: ${{ github.repository }}"
          echo "Enabled: ${{ steps.check-config.outputs.enabled }}"
          echo "Direction: ${{ github.event.inputs.sync_direction || 'hub-to-repo (scheduled)' }}"
          echo "Status: ${{ job.status }}"
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync with upstream
        if: github.event.inputs.sync_direction == 'upstream' || github.event_name == 'schedule'
        run: |
          echo "🔄 Syncing with upstream repository (if configured)"
          
          # Check if upstream is configured
          if git remote | grep -q upstream; then
            echo "Upstream remote found"
            git fetch upstream
            
            # Get current branch
            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            
            # Sync main branch
            git checkout main 2>/dev/null || git checkout -b main origin/main
            
            # Check if upstream/main exists
            if git rev-parse --verify upstream/main >/dev/null 2>&1; then
              echo "Merging upstream/main into main"
              git merge upstream/main --no-edit || {
                echo "⚠️  Merge conflict detected. Manual intervention required."
                exit 1
              }
              
              # Push changes
              git push origin main
              echo "✅ Successfully synced with upstream"
            else
              echo "⚠️  upstream/main branch not found"
            fi
            
            # Return to original branch
            git checkout $CURRENT_BRANCH
          else
            echo "ℹ️  No upstream remote configured"
            echo "To configure upstream:"
            echo "git remote add upstream <UPSTREAM_REPO_URL>"
          fi

      - name: Sync to mirror
        if: github.event.inputs.sync_direction == 'mirror'
        run: |
          echo "🪞 Syncing to mirror repository (if configured)"
          
          # Check if mirror is configured
          if git remote | grep -q mirror; then
            echo "Mirror remote found"
            
            # Push to mirror
            git push mirror --all --force
            git push mirror --tags --force
            
            echo "✅ Successfully synced to mirror"
          else
            echo "ℹ️  No mirror remote configured"
            echo "To configure mirror:"
            echo "git remote add mirror <MIRROR_REPO_URL>"
          fi

      - name: Report sync status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const syncDirection = context.payload.inputs?.sync_direction || 'upstream';
            const status = process.env.SYNC_STATUS || 'completed';
            
            console.log(`Repository sync ${syncDirection}: ${status}`);
            
            // Optional: Create an issue if sync fails
            if (status === 'failed') {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `⚠️ Repository sync failed - ${new Date().toISOString()}`,
                body: `The automated repository sync workflow encountered an error.\n\nSync direction: ${syncDirection}\n\nPlease review the workflow logs and resolve any conflicts manually.`,
                labels: ['automation', 'sync-issue']
              });
            }
