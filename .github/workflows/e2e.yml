name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
        python-version: ['3.9']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run application health check
        run: |
          python app.py &
          APP_PID=$!
          sleep 5
          
          # Health check
          curl -f http://localhost:5000/ || exit 1
          
          # Test API endpoints
          curl -f http://localhost:5000/api/resonance/status || exit 1
          curl -f http://localhost:5000/api/treasury/status || exit 1
          curl -f http://localhost:5000/api/governance/status || exit 1
          
          # Cleanup
          kill $APP_PID
        env:
          SECRET_KEY: test-secret-key
          DEBUG: 'False'
          ETH_RPC_URL: 'https://mainnet.infura.io/v3/test'
          ETH_VAULT_ADDRESS: '0x0000000000000000000000000000000000000000'
          NFT_CONTRACT_ADDRESS: '0x0000000000000000000000000000000000000000'
          IPFS_GATEWAY: 'https://ipfs.io/ipfs/'

      - name: Report test results
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "✅ All E2E tests passed"
          else
            echo "❌ E2E tests failed"
            exit 1
          fi
