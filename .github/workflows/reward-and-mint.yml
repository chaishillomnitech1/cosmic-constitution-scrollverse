name: Reward and Mint

on:
  pull_request:
    types: [closed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      recipient:
        description: 'Recipient address or GitHub username'
        required: true
      amount:
        description: 'Reward amount'
        required: true
        default: '100'
      reason:
        description: 'Reason for reward'
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  reward-contributor:
    runs-on: ubuntu-latest
    # Only run if PR was merged or manually triggered
    if: |
      (github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_dispatch')
    
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to reward'
        required: true
        type: number
      contributor:
        description: 'GitHub username of contributor'
        required: true
        type: string

jobs:
  reward:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --no-save ethers@6

      - name: Calculate reward
        id: calc-reward
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "amount=${{ github.event.inputs.amount }}" >> $GITHUB_OUTPUT
            echo "recipient=${{ github.event.inputs.recipient }}" >> $GITHUB_OUTPUT
            echo "reason=${{ github.event.inputs.reason }}" >> $GITHUB_OUTPUT
          else
            # For merged PRs, calculate based on size/complexity
            lines_added=$(jq -r '.pull_request.additions' <<< '${{ toJson(github.event) }}')
            lines_deleted=$(jq -r '.pull_request.deletions' <<< '${{ toJson(github.event) }}')
            files_changed=$(jq -r '.pull_request.changed_files' <<< '${{ toJson(github.event) }}')
            
            # Conservative reward calculation (pilot phase)
            base_reward=50
            size_bonus=$((lines_added / 100 + lines_deleted / 100))
            file_bonus=$((files_changed * 5))
            total=$((base_reward + size_bonus + file_bonus))
            
            # Cap at reasonable amount for pilot
            if [ $total -gt 500 ]; then
              total=500
            fi
            
            echo "amount=$total" >> $GITHUB_OUTPUT
            echo "recipient=${{ github.event.pull_request.user.login }}" >> $GITHUB_OUTPUT
            echo "reason=Merged PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
          fi

      - name: Mint reward (Test Mode)
        id: mint
        env:
          REWARDS_PRIVATE_KEY: ${{ secrets.REWARDS_PRIVATE_KEY }}
          REWARDS_CONTRACT_ADDRESS: ${{ secrets.REWARDS_CONTRACT_ADDRESS }}
          REWARDS_RPC_URL: ${{ secrets.REWARDS_RPC_URL }}
        run: |
          # Test mode - log reward without actual minting
          echo "🎁 Reward Details:"
          echo "  Recipient: ${{ steps.calc-reward.outputs.recipient }}"
          echo "  Amount: ${{ steps.calc-reward.outputs.amount }}"
          echo "  Reason: ${{ steps.calc-reward.outputs.reason }}"
          
          # Check if secrets are configured
          if [ -z "$REWARDS_PRIVATE_KEY" ] || [ -z "$REWARDS_CONTRACT_ADDRESS" ]; then
            echo "⚠️ Rewards system not configured (test mode)"
            echo "To enable rewards, add REWARDS_* secrets to repository"
            echo "tx_hash=test-mode-no-tx" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # TODO: Implement actual minting when contract is deployed
          # For now, just log the transaction
          echo "Would mint ${{ steps.calc-reward.outputs.amount }} to ${{ steps.calc-reward.outputs.recipient }}"
          echo "tx_hash=pending-implementation" >> $GITHUB_OUTPUT

      - name: Comment on PR with reward
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## 🎁 OmniRewards Reward Issued

            **Recipient:** @${{ steps.calc-reward.outputs.recipient }}
            **Amount:** ${{ steps.calc-reward.outputs.amount }} OMNI
            **Reason:** ${{ steps.calc-reward.outputs.reason }}
            **Status:** ${process.env.TX_HASH === 'test-mode-no-tx' ? '⚠️ Test Mode (Configure secrets to enable)' : '✅ Pending Implementation'}

            Thank you for your contribution to the Cosmic Constitution ScrollVerse! ❤️🔥

            ---
            *Phase 2 Pilot - Conservative reward settings*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
        env:
          TX_HASH: ${{ steps.mint.outputs.tx_hash }}

      - name: Log reward event
        run: |
          echo "=== Reward Event Log ===" >> rewards.log
          echo "Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> rewards.log
          echo "Recipient: ${{ steps.calc-reward.outputs.recipient }}" >> rewards.log
          echo "Amount: ${{ steps.calc-reward.outputs.amount }}" >> rewards.log
          echo "Reason: ${{ steps.calc-reward.outputs.reason }}" >> rewards.log
          echo "TX: ${{ steps.mint.outputs.tx_hash }}" >> rewards.log
          echo "========================" >> rewards.log
          cat rewards.log
      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install web3 requests

      - name: Calculate reward
        id: calculate
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || context.payload.inputs?.pr_number;
            const contributor = context.payload.pull_request?.user?.login || context.payload.inputs?.contributor;
            
            // Get PR details
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            // Calculate reward based on changes
            const additions = pr.additions || 0;
            const deletions = pr.deletions || 0;
            const changedFiles = pr.changed_files || 0;
            
            // Simple reward calculation (conservative pilot)
            let rewardPoints = 0;
            rewardPoints += Math.min(additions, 500) * 0.1;
            rewardPoints += Math.min(deletions, 200) * 0.05;
            rewardPoints += changedFiles * 5;
            
            // Cap rewards for pilot
            rewardPoints = Math.min(Math.floor(rewardPoints), 100);
            
            core.setOutput('points', rewardPoints);
            core.setOutput('contributor', contributor);
            core.setOutput('pr_number', prNumber);
            
            console.log(`Calculated ${rewardPoints} points for PR #${prNumber} by ${contributor}`);

      - name: Distribute reward (Mumbai Testnet)
        id: reward
        run: |
          node -e "
          const https = require('https');
          
          const rewardData = {
            contributor: '${{ steps.calculate.outputs.contributor }}',
            points: ${{ steps.calculate.outputs.points }},
            pr_number: ${{ steps.calculate.outputs.pr_number }},
            contract: process.env.REWARDS_CONTRACT_ADDRESS,
            testnet: 'mumbai'
          };
          
          console.log('🎁 Reward Distribution (PILOT - TESTNET ONLY)');
          console.log('Contributor:', rewardData.contributor);
          console.log('Points:', rewardData.points);
          console.log('PR:', rewardData.pr_number);
          console.log('Test Wallet:', process.env.PILOT_TEST_WALLET);
          console.log('Contract:', rewardData.contract);
          console.log('');
          console.log('⚠️  This is a PILOT program on Mumbai testnet');
          console.log('✅ Reward calculated successfully');
          console.log('');
          console.log('Next: Implement actual reward distribution when contract is deployed');
          "
        env:
          REWARDS_PRIVATE_KEY: ${{ secrets.REWARDS_PRIVATE_KEY }}
          ALCHEMY_MUMBAI_URL: ${{ secrets.ALCHEMY_MUMBAI_URL }}
          REWARDS_API_KEY: ${{ secrets.REWARDS_API_KEY }}
          REWARDS_CONTRACT_ADDRESS: ${{ secrets.REWARDS_CONTRACT_ADDRESS }}
          PILOT_TEST_WALLET: ${{ secrets.PILOT_TEST_WALLET }}

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const points = '${{ steps.calculate.outputs.points }}';
            const contributor = '${{ steps.calculate.outputs.contributor }}';
            
            const comment = `## 🎁 Reward Notification (PILOT)
            
            Congratulations @${contributor}! Your contribution has been recognized.
            
            **Reward Details:**
            - Points Earned: **${points}**
            - Network: Mumbai Testnet (Pilot)
            - Status: ✅ Calculated
            
            ---
            *This is a pilot program. Actual token distribution will be implemented in Phase 3.*
            
            ❤️🔥🧬💫🌌 Forever Rewarded. Forever Sacred. Forever One.`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number || context.payload.inputs?.pr_number,
              body: comment
            });
