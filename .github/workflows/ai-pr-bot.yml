name: AI PR Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get PR diff
        id: get-diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          DIFF=$(git diff origin/${{ github.event.pull_request.base.ref }}...HEAD)
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: AI Code Review
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          script: |
            const https = require('https');
            
            // Conservative AI settings
            const aiPrompt = `You are a code reviewer for the Cosmic Constitution ScrollVerse project.
            
            Review the following code changes and provide constructive feedback focusing on:
            - Code quality and best practices
            - Security concerns
            - Performance issues
            - Potential bugs
            - Documentation needs
            
            Be concise and focus only on important issues. Provide specific suggestions.
            
            Code changes:
            \`\`\`
            ${process.env.DIFF || 'No changes'}
            \`\`\``;
            
            // OpenAI API request (conservative settings)
            const data = JSON.stringify({
              model: 'gpt-3.5-turbo',
              messages: [
                {
                  role: 'system',
                  content: 'You are a helpful code reviewer. Be concise and constructive.'
                },
                {
                  role: 'user',
                  content: aiPrompt
                }
              ],
              max_tokens: 500,
              temperature: 0.3
            });
            
            const options = {
              hostname: 'api.openai.com',
              port: 443,
              path: '/v1/chat/completions',
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`,
                'Content-Length': data.length
              }
            };
            
            const makeRequest = () => {
              return new Promise((resolve, reject) => {
                const req = https.request(options, (res) => {
                  let body = '';
                  res.on('data', (chunk) => body += chunk);
                  res.on('end', () => {
                    if (res.statusCode === 200) {
                      resolve(JSON.parse(body));
                    } else {
                      reject(new Error(`OpenAI API error: ${res.statusCode} ${body}`));
                    }
                  });
                });
                req.on('error', reject);
                req.write(data);
                req.end();
              });
            };
            
            let reviewComment = '## 🤖 AI Code Review\n\n';
            
            try {
              const response = await makeRequest();
              const aiReview = response.choices[0].message.content;
              reviewComment += aiReview;
              reviewComment += '\n\n---\n*This review was generated by AI. Please use your judgment when addressing feedback.*';
            } catch (error) {
              console.error('AI review error:', error);
              reviewComment += '⚠️ AI review unavailable. Please proceed with manual review.\n\n';
              reviewComment += `Error: ${error.message}`;
            }
            
            // Post comment on PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: reviewComment
            });
