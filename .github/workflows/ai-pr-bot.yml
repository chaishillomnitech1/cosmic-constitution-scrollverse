name: AI PR Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Get PR changes
        id: pr-changes
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > pr_diff.txt
          echo "diff_size=$(wc -c < pr_diff.txt)" >> $GITHUB_OUTPUT

      - name: AI Code Review
        if: steps.pr-changes.outputs.diff_size != '0'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          # Conservative AI call settings - limit to reasonable diff sizes
          if [ $(wc -c < pr_diff.txt) -gt 50000 ]; then
            echo "⚠️ PR diff too large for AI review (>50KB). Skipping detailed AI analysis."
            echo "Please ensure the PR is focused and reasonable in size."
            exit 0
          fi

          # Create review prompt
          cat > review_prompt.txt << 'EOF'
          You are a code reviewer for the Cosmic Constitution ScrollVerse project.
          Review the following git diff and provide:
          1. Security concerns (if any)
          2. Code quality issues (if any)
          3. Suggestions for improvement (if any)
          4. Positive feedback on good practices

          Be concise and constructive. Format your response in markdown.
          Focus on Python, Flask, Web3, and smart contract security best practices.
          EOF

          # Prepare diff for API (properly escaped)
          diff_content=$(cat pr_diff.txt | head -c 20000 | jq -Rs .)
          prompt_content=$(cat review_prompt.txt | jq -Rs .)
          
          # Call OpenAI API (conservative settings)
          response=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "{
              \"model\": \"gpt-4o-mini\",
              \"messages\": [
                {
                  \"role\": \"system\",
                  \"content\": $prompt_content
                },
                {
                  \"role\": \"user\",
                  \"content\": $diff_content
                }
              ],
              \"max_tokens\": 1000,
              \"temperature\": 0.3
            }")

          # Extract review content
          review=$(echo "$response" | jq -r '.choices[0].message.content // "AI review failed"')

          # Post as PR comment
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d @- \
            "https://api.github.com/repos/$REPO_FULL_NAME/issues/$PR_NUMBER/comments" << COMMENT
          {
            "body": "## 🤖 AI Code Review\n\n$review\n\n---\n*Generated with conservative AI settings - Node 20, GPT-4o-mini, max 1000 tokens*"
          }
          COMMENT

      - name: Check for security keywords
        run: |
          # Simple keyword scan for common security issues
          if grep -iE "(password|secret|api[_-]?key|private[_-]?key|token)" pr_diff.txt | grep -v "EXAMPLE\|TODO\|\.example\|#"; then
            echo "⚠️ Warning: Possible hardcoded secrets detected in changes"
            echo "Please review the changes to ensure no sensitive data is committed"
          fi
      - name: Get PR diff
        id: get-diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          DIFF=$(git diff origin/${{ github.event.pull_request.base.ref }}...HEAD)
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: AI Code Review
        uses: actions/github-script@v8
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DIFF: ${{ steps.get-diff.outputs.diff }}
        with:
          script: |
            const https = require('https');
            
            // Conservative AI settings
            const aiPrompt = `You are a code reviewer for the Cosmic Constitution ScrollVerse project.
            
            Review the following code changes and provide constructive feedback focusing on:
            - Code quality and best practices
            - Security concerns
            - Performance issues
            - Potential bugs
            - Documentation needs
            
            Be concise and focus only on important issues. Provide specific suggestions.
            
            Code changes:
            \`\`\`
            ${process.env.DIFF || 'No changes'}
            \`\`\``;
            
            // OpenAI API request (conservative settings)
            const data = JSON.stringify({
              model: 'gpt-3.5-turbo',
              messages: [
                {
                  role: 'system',
                  content: 'You are a helpful code reviewer. Be concise and constructive.'
                },
                {
                  role: 'user',
                  content: aiPrompt
                }
              ],
              max_tokens: 500,
              temperature: 0.3
            });
            
            const options = {
              hostname: 'api.openai.com',
              port: 443,
              path: '/v1/chat/completions',
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`,
                'Content-Length': data.length
              }
            };
            
            const makeRequest = () => {
              return new Promise((resolve, reject) => {
                const req = https.request(options, (res) => {
                  let body = '';
                  res.on('data', (chunk) => body += chunk);
                  res.on('end', () => {
                    if (res.statusCode === 200) {
                      resolve(JSON.parse(body));
                    } else {
                      reject(new Error(`OpenAI API error: ${res.statusCode} ${body}`));
                    }
                  });
                });
                req.on('error', reject);
                req.write(data);
                req.end();
              });
            };
            
            let reviewComment = '## 🤖 AI Code Review\n\n';
            
            try {
              const response = await makeRequest();
              const aiReview = response.choices[0].message.content;
              reviewComment += aiReview;
              reviewComment += '\n\n---\n*This review was generated by AI. Please use your judgment when addressing feedback.*';
            } catch (error) {
              console.error('AI review error:', error);
              reviewComment += '⚠️ AI review unavailable. Please proceed with manual review.\n\n';
              reviewComment += `Error: ${error.message}`;
            }
            
            // Post comment on PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: reviewComment
            });
