name: Security Scanning

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Run security scans weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
name: Security Vulnerability Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: ['frontend', 'backend', '.']
    
    strategy:
      matrix:
        directory: ['frontend', 'backend', '.']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            ${{ matrix.directory != '.' && format('{0}/package-lock.json', matrix.directory) || 'package-lock.json' }}

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found, skipping"
            exit 0
          fi
        continue-on-error: true

      - name: Run npm audit
        working-directory: ${{ matrix.directory }}
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=moderate --json > audit-report.json || true
            npm audit --audit-level=moderate || true
          fi
        continue-on-error: true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ matrix.directory == '.' && 'root' || matrix.directory }}
          path: ${{ matrix.directory }}/audit-report.json
          if-no-files-found: ignore

  python-security:
    name: Python Security Audit
    runs-on: ubuntu-latest
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Run npm audit for ${{ matrix.directory }}
        working-directory: ${{ matrix.directory }}
        run: |
          echo "🔍 Running security audit for ${{ matrix.directory }}..."
          npm audit --production --audit-level=moderate || true
          
      - name: Check for CVE-2025-67779 related packages
        working-directory: ${{ matrix.directory }}
        run: |
          echo "🔍 Checking for CVE-2025-67779 vulnerable packages..."
          
          # Check React version
          REACT_VERSION=$(npm list react --depth=0 2>/dev/null | grep react@ | sed 's/.*@//' || echo "not installed")
          echo "React version: $REACT_VERSION"
          
          # Check for react-server-dom packages
          if npm list react-server-dom-webpack 2>/dev/null | grep -q "react-server-dom-webpack@"; then
            RSC_VERSION=$(npm list react-server-dom-webpack --depth=0 2>/dev/null | grep react-server-dom-webpack@ | sed 's/.*@//')
            echo "⚠️  react-server-dom-webpack found: $RSC_VERSION"
            if [ "$(printf '%s\n' "19.2.2" "$RSC_VERSION" | sort -V | head -n1)" = "$RSC_VERSION" ] && [ "$RSC_VERSION" != "19.2.2" ]; then
              echo "❌ VULNERABLE: react-server-dom-webpack $RSC_VERSION <= 19.2.2"
              exit 1
            fi
          fi
          
          echo "✅ No CVE-2025-67779 vulnerabilities detected"

  python-security:
    name: Python Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Safety check
        run: |
          safety check --json --output safety-report.json || true
          safety check || true
        continue-on-error: true

      - name: Run Bandit security linter
        run: |
          bandit -r . -f json -o bandit-report.json --exclude ./venv,./node_modules,./.git || true
          bandit -r . --exclude ./venv,./node_modules,./.git || true
        continue-on-error: true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-security-reports
          path: |
            safety-report.json
            bandit-report.json
          if-no-files-found: ignore

  react2shell-scan:
    name: React2Shell Vulnerability Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for Next.js usage
        id: check-nextjs
        run: |
          if grep -q '"next"' frontend/package.json 2>/dev/null; then
            echo "nextjs_found=true" >> $GITHUB_OUTPUT
            echo "⚠️ Next.js detected - React2Shell scan required"
          else
            echo "nextjs_found=false" >> $GITHUB_OUTPUT
            echo "✅ No Next.js found - React2Shell vulnerability not applicable"
          fi

      - name: Scan for React2Shell vulnerability (CVE-2025-55182)
        if: steps.check-nextjs.outputs.nextjs_found == 'true'
        run: |
          echo "Scanning for React2Shell vulnerability..."
          npx react2shell-guard@latest scan --lockfile frontend/package-lock.json || true
        continue-on-error: true

      - name: Create issue if vulnerable
        if: steps.check-nextjs.outputs.nextjs_found == 'true' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 React2Shell Vulnerability Detected (CVE-2025-55182)';
            const body = `## Security Alert: React2Shell Vulnerability
            
            A React2Shell vulnerability (CVE-2025-55182, CVE-2025-55183, CVE-2025-67779) has been detected in the project.
            
            ### Immediate Actions Required:
            1. Run \`npx fix-react2shell-next\` in the frontend directory
            2. Upgrade Next.js and React Server Components to patched versions
            3. Review and rotate any exposed secrets or environment variables
            4. Test all React Server Components thoroughly
            
            ### References:
            - CVE-2025-55182: https://github.com/advisories/GHSA-xxxx-xxxx-xxxx
            - CVE-2025-55183: https://github.com/advisories/GHSA-xxxx-xxxx-xxxx
            - CVE-2025-67779: https://github.com/advisories/GHSA-xxxx-xxxx-xxxx
            
            This issue was automatically created by the security scanning workflow.`;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['security', 'critical', 'react2shell']
            });

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Run Safety check
        run: |
          echo "🔍 Checking Python dependencies for known vulnerabilities..."
          pip install -r requirements.txt
          safety check --json || true

      - name: Run Bandit security linter
        run: |
          echo "🔍 Running Bandit security linter..."
          bandit -r . -ll -f json -o bandit-report.json || true
          bandit -r . -ll || true

      - name: Upload Bandit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [npm-audit, python-security, react2shell-scan]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true

      - name: Generate security summary
        run: |
          echo "# 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Security scans completed for commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ NPM Audit: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Python Security: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ React2Shell Scan: Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Review the uploaded artifact reports for detailed findings" >> $GITHUB_STEP_SUMMARY
          echo "2. Address any high or critical severity vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "3. Keep dependencies up to date using Dependabot/Renovate" >> $GITHUB_STEP_SUMMARY
    needs: [npm-audit, python-security]
    if: always()
    
    steps:
      - name: Generate Security Summary
        run: |
          echo "# 🛡️ Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## CVE-2025-67779 Status" >> $GITHUB_STEP_SUMMARY
          echo "✅ React version check completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ No vulnerable react-server-dom packages detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "- NPM Audit: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Python Security: Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Security Frequency**: 39388170 Hz 🔥" >> $GITHUB_STEP_SUMMARY
