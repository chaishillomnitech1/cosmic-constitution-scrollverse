# Queens Sovereignty Airdrop Configuration
# Eternal Crowns Solstice Distribution to 144,000 Akashic Queens

airdrop:
  name: "Eternal Crowns Solstice Airdrop"
  target_queens: 144000
  token_type: "QueensSovereignty NFT"
  
  phases:
    # Phase 1: Primary Queens (Complete at deployment)
    phase_1:
      name: "Initial Crown Distribution"
      queens: 3
      addresses:
        - address: "${MIKA_ADDRESS}"
          crown_type: MIKA_SOVEREIGN
          coherence: 100
          note: "Mika's Eternal Sovereign Crown"
        - address: "${LILATH_ADDRESS}"
          crown_type: LILATH_DIVINE
          coherence: 100
          note: "Lilath's Divine Crown of Wisdom"
        - address: "${LITTLE_WARREN_ADDRESS}"
          crown_type: LITTLE_WARREN_COSMIC
          coherence: 100
          note: "Little Warren's Cosmic Crown of Creation"
      
    # Phase 2: Harlem Queens Tribute Distribution
    phase_2:
      name: "Harlem Queens Tribute"
      queens: 1000
      crown_type: HARLEM_QUEENS_TRIBUTE
      minimum_coherence: 76
      tribute_required: true
      batch_size: 100
      start_date: "2024-12-21T18:00:00Z"  # 6 PM activation
      notes: |
        Honorific crowns for queens who submit Harlem tribute data.
        Requires minimum 76% coherence (Sovereign level).
        Distributed in batches of 100.
      
    # Phase 3: Akashic Sentient Expansion (Auto-trigger)
    phase_3:
      name: "Akashic Sentient Expansion"
      queens: 142997
      crown_type: AKASHIC_SENTIENT
      minimum_coherence: 51
      auto_trigger: true
      frequency: 528  # Hz - Love/Trust/Coherence frequency
      start_date: "2024-12-22T09:04:00Z"  # 9:04 AM Solstice
      duration_days: 90
      notes: |
        Automated distribution via coherence oracle.
        Queens achieving 51%+ coherence auto-receive crowns.
        Triggered by 528Hz coherence overlay system.

  # $MEDAIR Token Distribution
  medair_allocation:
    total_pool: 10000000  # 10 Million $MEDAIR
    per_queen: 69.44      # Base allocation per crowned queen
    
    # Coherence-based bonuses
    coherence_bonus:
      sovereign: 1.5      # 76-95% coherence: 1.5x multiplier
      divine: 3.0         # 96-100% coherence: 3.0x multiplier
    
    # Distribution schedule
    distribution_schedule:
      start_date: "2024-12-22T09:04:00Z"  # Solstice
      duration_days: 90     # 3 months initial distribution
      vesting_period: 180   # 6 months vesting
      
    # Reserved allocations
    reserves:
      harlem_tribute_pool: 1000000   # 1M for Harlem Queens
      coherence_bonus_pool: 2000000  # 2M for high coherence
      emergency_reserve: 500000      # 500K emergency reserve

  # Russell-weighting DAO Integration
  dao_integration:
    enabled: true
    voting_weight_multipliers:
      EMERGING: 1      # 0-25% coherence
      ALIGNED: 2       # 26-50% coherence
      HARMONIOUS: 3    # 51-75% coherence
      SOVEREIGN: 5     # 76-95% coherence
      DIVINE: 10       # 96-100% coherence
    
    governance_threshold: 51  # Minimum coherence for DAO participation
    proposal_creation: 76     # Minimum coherence to create proposals

  # IPFS Metadata Configuration
  ipfs:
    gateway: "https://ipfs.io/ipfs/"
    pinning_service: "pinata"
    auto_upgrade: true
    metadata_template: |
      {
        "name": "{crown_name}",
        "description": "{crown_description}",
        "image": "ipfs://{image_hash}",
        "attributes": [
          {"trait_type": "Crown Type", "value": "{crown_type}"},
          {"trait_type": "Coherence Level", "value": "{coherence_level}"},
          {"trait_type": "Coherence Score", "value": {coherence_score}},
          {"trait_type": "Resonance Frequency", "value": "528 Hz"},
          {"trait_type": "Harlem Tribute", "value": "{has_tribute}"},
          {"trait_type": "Akashic Upgraded", "value": "{is_upgraded}"}
        ]
      }

  # Monitoring and Analytics
  monitoring:
    enabled: true
    track_metrics:
      - total_crowns_minted
      - average_coherence_score
      - crown_type_distribution
      - medair_distributed
      - active_queens
      - dao_participation_rate
    
    alert_thresholds:
      low_coherence: 30        # Alert if avg coherence < 30%
      high_mint_rate: 1000     # Alert if >1000 mints/hour
      oracle_downtime: 300     # Alert if oracle down >5 min
    
    reporting_interval: 3600   # Generate reports every hour

  # Security Settings
  security:
    rate_limiting:
      enabled: true
      max_mints_per_block: 50
      cooldown_period: 3600    # 1 hour between manual mints
    
    access_control:
      admin_multisig: true
      required_signatures: 3
      authorized_oracles:
        - "${MEDAIR_ORACLE_ADDRESS}"
    
    emergency_procedures:
      pause_enabled: true
      pause_duration_max: 86400  # 24 hours max pause

# Deployment Configuration
deployment:
  network: "sepolia"  # or "mumbai" or "mainnet"
  gas_settings:
    max_priority_fee: 2  # gwei
    max_fee: 100         # gwei
  
  verification:
    etherscan: true
    sourcify: true

# Notes and Instructions
notes: |
  This configuration file defines the complete airdrop strategy for
  the Queens Sovereignty Eternal Crowns system.
  
  Key Dates:
  - 6 PM (Dec 21): Phase 2 activation - Harlem Queens Tribute
  - 9:04 AM (Dec 22): Solstice - Phase 3 auto-trigger activation
  
  To execute:
  1. Update environment variables (MIKA_ADDRESS, LILATH_ADDRESS, etc.)
  2. Deploy QueensSovereignty contract
  3. Configure MedAir Oracle integration
  4. Run: node scripts/executeQueensAirdrop.js --config=airdrop-config.yaml
  
  For dry run:
  node scripts/executeQueensAirdrop.js --config=airdrop-config.yaml --dry-run
